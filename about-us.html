<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About Us | Mtoto Ni Jamii Foundation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

/*==============================
        GENERAL
==============================*/

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#ffffff;
overflow-x:hidden;
}

.container{
width:90%;
max-width:1300px;
margin:auto;
}

/*==============================
        NAVIGATION
==============================*/

header{

position:sticky;
top:0;
z-index:999;

background:#ffffff;

box-shadow:0 3px 12px rgba(0,0,0,.08);

}

header .container{

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 0;

}

.logo img{

height:65px;

}

nav ul{

display:flex;
list-style:none;
gap:35px;

}

nav ul li a{

text-decoration:none;
font-weight:500;
font-size:16px;

color:#333;

transition:.3s;

}

nav ul li a:hover,
nav ul li a.active{

color:#2d8f3d;

}

.donate-btn{

background:#2d8f3d;
color:#fff;

padding:14px 30px;

border-radius:50px;

text-decoration:none;

font-weight:600;

transition:.3s;

}

.donate-btn:hover{

background:#145ca8;

}

/*==============================
      MOBILE MENU
==============================*/

.menu-btn{

display:none;

font-size:30px;

cursor:pointer;

color:#145ca8;

}

@media(max-width:992px){

.menu-btn{

display:block;

}

.donate-btn{

display:none;

}

nav{

display:none;
width:100%;

}

nav.active{

display:block;

animation:fade .4s;

}

nav ul{

flex-direction:column;

background:#fff;

margin-top:20px;

padding:20px;

border-radius:15px;

box-shadow:0 10px 25px rgba(0,0,0,.1);

text-align:center;

gap:20px;

}

header .container{

flex-wrap:wrap;

}

}

@keyframes fade{

from{

opacity:0;
transform:translateY(-15px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/*==============================
        ABOUT HERO
==============================*/

.about-hero{

height:500px;

background:url("images/about-banner.jpg") center center/cover;

display:flex;

justify-content:center;

align-items:center;

position:relative;

}

.about-hero::before{

content:"";

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(15,61,124,.55);

}

.hero-content{

position:relative;

text-align:center;

color:#fff;

padding:20px;

z-index:2;

}

.hero-content h1{

font-size:70px;

font-weight:700;

margin-bottom:20px;

}

.hero-content p{

font-size:24px;

font-weight:300;

max-width:700px;

margin:auto;

line-height:1.8;

}

@media(max-width:768px){

.about-hero{

height:350px;

}

.hero-content h1{

font-size:45px;

}

.hero-content p{

font-size:18px;

}

}

</style>

</head>

<body>

<!--==============================
        NAVIGATION
===============================-->

<header>

<div class="container">

<div class="logo">

<img src="images/MnJlogo.png" alt="Logo">

</div>

<nav id="navbar">

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="about.html" class="active">About Us</a></li>

<li><a href="#">Programs</a></li>

<li><a href="#">Gallery</a></li>

<li><a href="#">Get Involved</a></li>

<li><a href="#">Contact</a></li>

</ul>

</nav>

<a href="#" class="donate-btn">

<i class="fa-solid fa-heart"></i>

Donate

</a>

<div class="menu-btn" onclick="toggleMenu()">

<i class="fa-solid fa-bars"></i>

</div>

</div>

</header>

<!--==============================
        ABOUT HERO
===============================-->

<section class="about-hero">

<div class="hero-content">

<h1>About Us</h1>

<p>

Empowering Every Child,<br>

Building Stronger Communities.

</p>

</div>

</section>

<script>

function toggleMenu(){

document.getElementById("navbar").classList.toggle("active");

}

</script>

</body>

</html>
